<!DOCTYPE html>
<html>
<head>
    <script src="https://unpkg.com/alpinejs" defer></script>
    <script src="/dist/cdn.js"></script>
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.components.register('complex-model', 'complex-model/complex-model.html');
        });
    </script>
</head>
<body x-data="{ count: 0, name: 'John' }">
    <div id="parent-output">
        Name: <span x-text="name" id="parent-name"></span>
        Count: <span x-text="count" id="parent-count"></span>
    </div>
    
    <button @click="count++" id="increment">Increment</button>
    <button @click="name = 'Jane'" id="change-name">Change Name</button>
    
    <!-- Test Case: x-model + x-bind + multi-root x-modelable -->
    <template 
        x-component="complex-model" 
        :title="'Hello World'" 
        :count="count" 
        x-model="name">
    </template>
</body>
</html>
