<!DOCTYPE html>
<html>
<head>
    <script src="https://unpkg.com/alpinejs" defer></script>
    <script src="/dist/cdn.js"></script>
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.components.register('simple', 'simple/simple.html');
            Alpine.components.register('withJs', 'withJs/withJs.html', 'withJs/withJs.js');
            Alpine.components.register('loading', 'loading/loading.html');
        });
    </script>
</head>
<body>
    <div x-data>
        <div x-component="simple" id="simple-target"></div>
    </div>
</body>
</html>
